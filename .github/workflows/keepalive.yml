# Mantém o Render acordado (hiberna após 15 min) e o Supabase ativo (pausa após 7 dias
# sem atividade). /health executa SELECT 1 no Postgres, então cada ping conta como uso
# do banco. A URL vem da variável de repositório SLATE_API_URL (docs/deploy.md).
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        env:
          SLATE_API_URL: ${{ vars.SLATE_API_URL }}
        run: |
          if [ -z "$SLATE_API_URL" ]; then
            echo "::warning::variável SLATE_API_URL não configurada; keepalive inativo"
            exit 0
          fi
          # Cold start do free tier leva 30-50s: timeout folgado e uma nova tentativa.
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 10 \
            --retry-all-errors "${SLATE_API_URL%/}/health"
