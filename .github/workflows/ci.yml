name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Um push novo no PR cancela a rodada anterior; em main cada commit roda até o fim.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests
      # Contrato consumido pelo slate-web: falha se openapi.json não bater com as rotas.
      - run: uv run python -m app.openapi --check
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      # O runner já tem Docker; o conftest sobe Postgres 17 via testcontainers e,
      # com CI definida, falha em vez de pular se o container não subir.
      - run: uv run pytest -q
